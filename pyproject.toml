[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrivesync"
version = "0.1.0"
description = "Dropbox-style Google Drive sync for Linux with Nautilus integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "watchdog>=4.0",
    "jeepney>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gdrivesync = "gdrivesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdrivesync = ["desktop/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
